spring:
  application:
    name: farm-to-table

  datasource:
    url: jdbc:postgresql://localhost:5432/farm_to_table
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tocomputer}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8083}

jwt:
  secret: ${JWT_SECRET:ZmFybXRvdGFibGVzdXBlcnNlY3JldGtleTIwMjZzYWZlYW5kbG9uZ2Vub3VnaGZvcmp3dA==}
  expiration: 86400000